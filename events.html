#testAnimation{
    width:50px;

<body>

    </div><button onclick="myMove()">Click Me</button>
    <div id="testContainer">
    <div id="testAnimation"></div>
    
    <script>
        var id = null;
        function myMove() {
        var elem = document.getElementById("testAnimation");  
        elem.style.opacity = "0";
        var pos = 0;
        var opp = 0;
        clearInterval(id);
        id = setInterval(frame, 10);
        function frame() {
            if (pos == 350) {
            clearInterval(id);
            } else {
            pos++;
            opp++;
            elem.style.opacity = opp / 100;
            elem.style.top = pos + 'px'; 
            elem.style.left = pos + 'px';
            }
        }
        }
    </script>
